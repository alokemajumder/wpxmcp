name: Companion plugin report
description: Something about the WordPress-side plugin — install, endpoints, or behaviour
labels: [companion-plugin]
body:
  - type: markdown
    attributes:
      value: |
        The companion plugin is optional and only needed for WP-CLI, SQL, theme files,
        the error log, cache purges, profiling, developer introspection, plugin settings
        and admin screens, unregistered meta, options, snippets and editable fields.
        Please run `test_site` first — it reports whether the plugin is active — and
        include the plugin version: tools added in 2.0.0 need the 2.0.0 plugin.

  - type: input
    id: wp
    attributes:
      label: WordPress, PHP and companion plugin versions
      placeholder: "WordPress 6.7, PHP 8.2, wpxmcp Helper 2.0.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - Installation or activation
        - WP-CLI emulation
        - SQL queries
        - Theme files or the draft workflow
        - Editable fields
        - Code snippets
        - Post meta or options
        - Error log, cache purge, security or backup status
        - Profiling (profile_url, get_template_for_url)
        - Developer introspection (registry, options, database)
        - Plugin settings or wp-admin screens
        - Something else
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: What happened
      description: Include the tool call, the error, and anything in the PHP error log.
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host or stack
      description: Shared host, managed WordPress, Local, Docker — filesystem permissions differ a lot between them.
    validations:
      required: false
