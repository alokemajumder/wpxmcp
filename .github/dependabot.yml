version: 2

updates:
  # Runtime and build dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      # One PR for the routine bumps, so review effort goes to the ones that matter.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-patches:
        dependency-type: production
        update-types: [patch]
    ignore:
      # The MCP SDK sets the protocol revisions this server speaks; take those
      # deliberately rather than automatically.
      - dependency-name: "@modelcontextprotocol/*"
        update-types: [version-update:semver-major]
      # undici 8 needs Node 22.19+, and its dispatcher must match the undici
      # inside Node's own fetch; move with the engines field, not before it.
      - dependency-name: "undici"
        update-types: [version-update:semver-major]
      # Type definitions track the oldest supported Node (see engines), so code
      # cannot compile against APIs that runtime lacks.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # The pinned actions in the CI workflow.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
