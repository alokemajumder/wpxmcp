name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify the bundled skills are committed and current
        run: |
          npm run bundle:skills
          git diff --exit-code src/generated/skills.ts \
            || (echo "::error::src/generated/skills.ts is stale. Run 'npm run bundle:skills' and commit the result." && exit 1)

      - name: Verify both entry points register the same tools
        run: |
          node -e "
            import('./dist/toolset.js').then(async ({ buildToolset }) => {
              const { SiteRegistry } = await import('./dist/lib/registry.js');
              const { installNodePlatform } = await import('./dist/platform-node.js');
              installNodePlatform();
              const tools = buildToolset({ registry: new SiteRegistry() });
              console.log(tools.length + ' tools registered');
              if (tools.length < 100) { console.error('Unexpectedly few tools'); process.exit(1); }
              let problems = 0;
              for (const t of tools) {
                if (!t.description || t.description.length < 40) {
                  console.error('Tool ' + t.name + ' has an inadequate description');
                  problems++;
                }
                for (const [k, v] of Object.entries(t.schema)) {
                  if (k === 'site_id') continue;
                  const d = v?._def?.description
                    ?? v?._def?.innerType?._def?.description
                    ?? v?._def?.innerType?._def?.innerType?._def?.description;
                  if (!d) {
                    console.error('Parameter ' + t.name + '.' + k + ' has no .describe()');
                    problems++;
                  }
                }
              }
              if (problems) {
                console.error('::error::' + problems + ' tool or parameter descriptions are missing. A model chooses tools by reading these.');
                process.exit(1);
              }
            }).catch((e) => { console.error(e); process.exit(1); });
          "

  php:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint the companion plugin
        run: |
          find wp-plugin -name '*.php' -print0 | xargs -0 -n1 php -l

  worker:
    name: Worker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Dry-run the Cloudflare deploy
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
