name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify the bundled skills are committed and current
        run: |
          npm run bundle:skills
          git diff --exit-code src/generated/skills.ts \
            || (echo "::error::src/generated/skills.ts is stale. Run 'npm run bundle:skills' and commit the result." && exit 1)

      - name: Verify the tool reference is current
        run: |
          npm run docs:tools
          git diff --exit-code docs/TOOLS.md \
            || (echo "::error::docs/TOOLS.md is stale. Run 'npm run build && npm run docs:tools' and commit the result." && exit 1)

  php:
    name: PHP ${{ matrix.php }} lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint the companion plugin
        run: |
          find wp-plugin -name '*.php' -print0 | xargs -0 -n1 php -l

  worker:
    name: Worker build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Dry-run the Cloudflare deploy
        run: npx wrangler deploy --dry-run --outdir /tmp/worker-build
